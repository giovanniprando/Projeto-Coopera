<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor Coopera</title>
    <script src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="card">
    <section class="Main">
        <div class="Titulo">
            <h1>Medidor Coopera</h1>
            <h2>Juntos por uma energia mais acessível. Simule seu consumo e descubra as vantagens de fazer parte da Coopera Luz.</h2>
        </div>
        <div class="form">
            <label for="nomeaparelho">Nome do Aparelho</label>
            <input type="text" id="nomeaparelho" placeholder="Ex: Geladeira">

            <label for="potencia">Potência (W)</label>
            <input type="number" id="potencia" placeholder="Ex: 150">

            <label for="tempo">Tempo de uso (horas)</label>
            <input type="number" id="tempo" placeholder="Ex: 24">

            <label for="diasMes">Dias de uso no Mês</label>
            <input type="number" id="diasMes" placeholder="Ex: 30">

            <button id="calcular">Calcular</button>
            <button id="limpar">Limpar</button>
        </div>
    </section>
    </section>


</body>
</html>
